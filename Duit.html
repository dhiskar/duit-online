function openKategoriForm(jenis, id, onDone) {
  var editing = id ? kategoriById(id) : null;
  var st = editing ? { nama: editing.nama, ikon: editing.ikon, warna: editing.warna } :
    { nama: '', ikon: jenis === 'masuk' ? 'bonus' : 'food', warna: jenis === 'masuk' ? '#22C55E' : '#F97316' };

  function body() {
    return '<div class="form">' +
      '<div class="field"><label>Nama kategori</label><input type="text" id="f_knama" maxlength="24" placeholder="mis. Kopi, Servis motor" value="' + esc(st.nama) + '"></div>' +
      '<div class="field"><label>Ikon</label><div class="icon-grid">' +
        IKON_KATEGORI.map(function (ic) {
          return '<button type="button" class="icon-pick ' + (st.ikon === ic ? 'on' : '') + '" data-ikon="' + ic + '" aria-label="' + ic + '">' + icon(ic) + '</button>';
        }).join('') + '</div></div>' +
      '<div class="field"><label>Warna</label><div class="swatches">' +
        WARNA_PILIH.map(function (c) {
          return '<button type="button" class="swatch ' + (st.warna === c ? 'on' : '') + '" data-warna="' + c + '" style="background:' + c + '" aria-label="Warna ' + c + '"></button>';
        }).join('') + '</div></div>' +
      '<div class="sheet-actions">' +
        (editing ? '<button type="button" class="btn btn-danger" data-kact="hapus">' + icon('trash') + '</button>' : '') +
        '<button type="button" class="btn btn-primary" data-kact="simpan">' + icon('check') + 'Simpan</button>' +
      '</div>' +
      (editing ? '<div class="sheet-note">Dipakai di ' + kategoriDipakai(editing.id) + ' catatan.</div>' : '') +
      '</div>';
  }

  var sheet = openSheet({
    title: editing ? 'Ubah kategori' : 'Kategori baru',
    subtitle: jenis === 'masuk' ? 'Kategori pemasukan' : 'Kategori pengeluaran',
    body: body()
  });

  function bind() {
    var nm = sheet.el.querySelector('#f_knama');
    if (nm) { nm.addEventListener('input', function () { st.nama = nm.value; }); }
  }
  bind();

  sheet.el.addEventListener('click', function (e) {
    var ic = e.target.closest('[data-ikon]');
    if (ic) { st.ikon = ic.dataset.ikon; sheet.el.querySelector('.sheet-body').innerHTML = body(); bind(); return; }
    var w = e.target.closest('[data-warna]');
    if (w) { st.warna = w.dataset.warna; sheet.el.querySelector('.sheet-body').innerHTML = body(); bind(); return; }
    var b = e.target.closest('[data-kact]');
    if (!b) return;

    if (b.dataset.kact === 'simpan') {
      if (!st.nama.trim()) { toast('Nama kategori wajib diisi', 'err'); return; }
      var dup = db.kategori.filter(function (k) {
        return k.jenis === jenis && k.nama.toLowerCase() === st.nama.trim().toLowerCase() && (!editing || k.id !== editing.id);
      }).length;
      if (dup) { toast('Nama kategori sudah ada', 'err'); return; }
      if (editing) {
        Object.assign(editing, { nama: st.nama.trim(), ikon: st.ikon, warna: st.warna });
      } else {
        db.kategori.push({ id: nextId('k'), nama: st.nama.trim(), jenis: jenis, ikon: st.ikon, warna: st.warna });
      }
      saveDB();
      sheet.close();
      if (onDone) onDone();
      toast(editing ? 'Kategori diperbarui' : 'Kategori ditambahkan', 'ok');
    }

    if (b.dataset.kact === 'hapus' && editing) {
      var used = kategoriDipakai(editing.id);
      if (used > 0) { toast('Kategori masih dipakai ' + used + ' catatan. Ubah catatan itu dulu.', 'err'); return; }
      var same = db.kategori.filter(function (k) { return k.jenis === editing.jenis; });
      if (same.length <= 1) { toast('Minimal satu kategori per jenis', 'err'); return; }
      confirmSheet({
        title: 'Hapus kategori?',
        message: 'Kategori “' + editing.nama + '” akan dihapus.',
        confirmText: 'Ya, hapus'
      }).then(function (ok) {
        if (!ok) return;
        db.kategori = db.kategori.filter(function (k) { return k.id !== editing.id; });
        saveDB();
        sheet.close();
        if (onDone) onDone();
        toast('Kategori dihapus', 'ok');
      });
    }
  });
}

/* ---------- cadangan & data ---------- */
function downloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function exportBackup() {
  var payload = { app: 'catatan-duit', version: 1, disimpan: nowStamp(), data: db };
  downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), 'cadangan-duit-' + todayISO() + '.json');
  toast('Cadangan diunduh ke folder Download', 'ok');
}

function exportCsv() {
  var key = ui.lapBulan;
  var list = txBulan(key);
  if (!list.length) { toast('Belum ada transaksi bulan ini', 'err'); return; }
  var rows = [['Tanggal', 'Tipe', 'Kategori', 'Dompet', 'DompetTujuan', 'Jumlah', 'Catatan']];
  list.slice().sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : 0; }).forEach(function (t) {
    var k = kategoriById(t.kategori) || {};
    var w = dompetById(t.dompet) || {};
    var tujuan = t.dompetTujuan ? (dompetById(t.dompetTujuan) || {}) : {};
    rows.push([
      t.tanggal,
      t.tipe === 'masuk' ? 'Pemasukan' : t.tipe === 'keluar' ? 'Pengeluaran' : 'Transfer',
      t.tipe === 'transfer' ? '' : (k.nama || ''),
      w.nama || '',
      tujuan.nama || '',
      t.jumlah,
      t.catatan || ''
    ]);
  });
  var csv = rows.map(function (r) {
    return r.map(function (v) {
      var s = String(v == null ? '' : v);
      return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  downloadBlob(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }), 'duit-' + key + '.csv');
  toast('CSV ' + monthLabel(key) + ' diunduh', 'ok');
}

function importBackupFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  file.text().then(function (text) {
    var parsed = JSON.parse(text);
    var data = parsed && parsed.data ? parsed.data : parsed;
    if (!data || !Array.isArray(data.transaksi) || !Array.isArray(data.dompet)) {
      throw new Error('format data tidak dikenal');
    }
    var preview = normalizeDB(data);
    return confirmSheet({
      title: 'Pulihkan data?',
      message: 'Data dari “' + file.name + '” (' + preview.transaksi.length + ' transaksi, ' + preview.dompet.length + ' dompet) akan menggantikan semua data saat ini.',
      confirmText: 'Pulihkan'
    }).then(function (ok) {
      if (!ok) return;
      return window.DuitOnline.replaceData(preview).then(function () {
        applyTheme();
        go('home');
        toast('Data berhasil dipulihkan dan disimpan ke cloud', 'ok');
      });
    });
  }).catch(function (err) {
    toast('Pemulihan gagal: ' + (err && err.message || err), 'err');
  }).finally(function () {
    input.value = '';
  });
}

document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'importFile') importBackupFile(e.target);
});

}

function fsLinked() { return !!(db.meta && db.meta.fileLinked); }
function fsNeedsPermission() { return !!fsNeedsPerm; }
function fsFileName() { return (db.meta && db.meta.fileName) || ''; }
function fsLastWrite() { return (db.meta && db.meta.lastFileWrite) || ''; }

/* ---------- IndexedDB kecil ---------- */
function idbOpen() {
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) { reject(new Error('IndexedDB tidak tersedia')); return; }
    var req = indexedDB.open(FS_DB, 1);
    req.onupgradeneeded = function () {
      if (!req.result.objectStoreNames.contains(FS_STORE)) req.result.createObjectStore(FS_STORE);
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbGet(key) {
  return idbOpen().then(function (d) {
    return new Promise(function (resolve, reject) {
      var q = d.transaction(FS_STORE, 'readonly').objectStore(FS_STORE).get(key);
      q.onsuccess = function () { resolve(q.result); };
      q.onerror = function () { reject(q.error); };
    });
  });
}
function idbSet(key, val) {
  return idbOpen().then(function (d) {
    return new Promise(function (resolve, reject) {
      var tx = d.transaction(FS_STORE, 'readwrite');
      tx.objectStore(FS_STORE).put(val, key);
      tx.oncomplete = function () { resolve(true); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function idbDel(key) {
  return idbOpen().then(function (d) {
    return new Promise(function (resolve, reject) {
      var tx = d.transaction(FS_STORE, 'readwrite');
      tx.objectStore(FS_STORE).delete(key);
      tx.oncomplete = function () { resolve(true); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}

/* ---------- isi file ---------- */
function fsPayload() {
  return JSON.stringify({
    app: 'catatan-duit',
    version: 1,
    disimpan: nowStamp(),
    data: db
  }, null, 2);
}
function fsParse(text) {
  var parsed = JSON.parse(text);
  var payload = parsed && parsed.data ? parsed.data : parsed;
  if (!payload || !Array.isArray(payload.transaksi) || !Array.isArray(payload.dompet) || !Array.isArray(payload.kategori)) {
    throw new Error('format data tidak dikenal');
  }
  return { data: normalizeDB(payload), disimpan: (parsed && parsed.disimpan) || '' };
}

function fsMirror(data) {
  try { idbSet('mirror', { data: data, waktu: nowStamp() }).catch(function () {}); } catch (e) {}
}
function persistLocal() {
  return false;
}

/* ---------- tulis ke file ---------- */
async function fsWriteNow() {
  if (!fsHandle) return false;
  if (fsBusy) { fsPending = true; return false; }
  fsBusy = true;
  try {
    var perm = await fsHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      fsNeedsPerm = true;
      return false;
    }
    db.meta.lastFileWrite = nowStamp();
    var w = await fsHandle.createWritable();
    await w.write(fsPayload());
    await w.close();
    persistLocal();
    fsNeedsPerm = false;
    return true;
  } catch (err) {
    fsNeedsPerm = true;
    return false;
  } finally {
    fsBusy = false;
    if (fsPending) { fsPending = false; fsWriteNow(); }
  }
}

function fsQueueWrite() {
  if (!fsHandle || !fsLinked()) return;
  clearTimeout(fsWriteTimer);
  fsWriteTimer = setTimeout(function () {
    fsWriteNow().then(function (ok) {
      if (!ok && fsNeedsPerm) {
        if (!openSheets.length) { render(); return; }
        var el = document.querySelector('[data-storage-note]');
        if (el) el.innerHTML = storageNoteInnerHTML();
      }
    });
  }, 700);
}

/* ---------- sambungkan / buka file ---------- */
async function fsPickSave() {
  if (!fsSupported()) {
    toast('Browser ini belum mendukung simpan file otomatis — memakai unduhan', '');
    exportBackup();
    return;
  }
  try {
    var handle = await window.showSaveFilePicker({
      suggestedName: 'duit-data.json',
      id: 'duit',
      startIn: 'documents',
      types: [{ description: 'Data Duit (JSON)', accept: { 'application/json': ['.json'] } }]
    });
    fsHandle = handle;
    fsNeedsPerm = false;
    db.meta.fileLinked = true;
    db.meta.fileName = handle.name || 'duit-data.json';
    try { await idbSet(FS_KEY, handle); } catch (e) {}
    var ok = await fsWriteNow();
    persistLocal();
    toast(ok ? 'Terhubung — data disimpan otomatis ke file' : 'File terhubung, izin tulis diperlukan', ok ? 'ok' : 'err');
    refreshAfterStorageChange();
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    if (err && (err.name === 'SecurityError' || err.name === 'NotAllowedError')) {
      toast('Chrome menolak akses file dari halaman ini. Pakai "Unduh cadangan" atau buka lewat http://localhost.', 'err');
    } else {
      toast('Gagal membuka pemilih file (' + ((err && err.name) || 'error') + ')', 'err');
    }
  }
}

async function fsPickOpen() {
  if (!fsSupported()) {
    var inp = $('#importFile');
    if (inp) inp.click();
    return;
  }
  try {
    var arr = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'Data Duit (JSON)', accept: { 'application/json': ['.json'] } }]
    });
    var handle = arr && arr[0];
    if (!handle) return;
    var text = await (await handle.getFile()).text();
    var parsed = fsParse(text);
    var ok = await confirmSheet({
      title: 'Buka file data?',
      message: 'Data dari “' + handle.name + '” (' + parsed.data.transaksi.length + ' transaksi, ' +
        parsed.data.dompet.length + ' dompet) akan dipakai dan data saat ini diganti.',
      confirmText: 'Buka & pakai'
    });
    if (!ok) return;
    fsHandle = handle;
    fsNeedsPerm = false;
    db = parsed.data;
    db.meta.fileLinked = true;
    db.meta.fileName = handle.name;
    db.meta.lastFileWrite = parsed.disimpan || nowStamp();
    try { await idbSet(FS_KEY, handle); } catch (e) {}
    persistLocal();
    ui.txBulan = monthKey(todayISO());
    ui.lapBulan = monthKey(todayISO());
    ui.budgetBulan = monthKey(todayISO());
    go('home');
    toast('Data dimuat dan tersambung ke file', 'ok');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    toast('File tidak bisa dibuka: ' + ((err && err.message) || err), 'err');
  }
}

async function fsRequestPermission() {
  if (!fsHandle) { fsPickSave(); return; }
  try {
    var perm = await fsHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast('Izin akses file ditolak', 'err'); return; }
    fsNeedsPerm = false;
    await fsReconcile();
    toast('Akses file aktif — data disimpan otomatis', 'ok');
    refreshAfterStorageChange();
  } catch (err) {
    toast('Gagal meminta izin file', 'err');
  }
}

async function fsUnlink() {
  var ok = await confirmSheet({
    title: 'Putuskan file data?',
    message: 'Data akun tetap tersimpan di Supabase.',
    confirmText: 'Putuskan'
  });
  if (!ok) return;
  try { await idbDel(FS_KEY); } catch (e) {}
  fsHandle = null;
  fsNeedsPerm = false;
  if (db.meta) { db.meta.fileLinked = false; db.meta.fileName = ''; }
  saveDB();
  refreshAfterStorageChange();
  toast('File data diputuskan', 'ok');
}

async function fsReconcile() {
  try {
    var text = await (await fsHandle.getFile()).text();
    var parsed = fsParse(text);
    var localTs = (db.meta && db.meta.updatedAt) || '';
    if (parsed.disimpan && parsed.disimpan > localTs) {
      db = parsed.data;
      db.meta.fileLinked = true;
      db.meta.fileName = fsHandle.name;
      db.meta.lastFileWrite = parsed.disimpan;
      persistLocal();
      render();
      toast('Data terbaru dimuat dari file di HP', 'ok');
      return;
    }
    await fsWriteNow();
  } catch (err) {
    await fsWriteNow();
  }
}

async function fsInit() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) {
      var mirror = await idbGet('mirror');
      if (mirror && mirror.data) {
        db = normalizeDB(mirror.data);
        persistLocal();
        toast('Data dipulihkan dari cadangan browser', 'ok');
      }
    }
  } catch (e) {}

  try {
    var handle = await idbGet(FS_KEY);
    if (handle && handle.name) {
      fsHandle = handle;
      db.meta = db.meta || {};
      db.meta.fileLinked = true;
      db.meta.fileName = handle.name;
      var perm = 'prompt';
      try { perm = await handle.queryPermission({ mode: 'readwrite' }); } catch (e) { perm = 'prompt'; }
      if (perm === 'granted') {
        fsNeedsPerm = false;
        await fsReconcile();
      } else {
        fsNeedsPerm = true;
      }
      persistLocal();
    }
  } catch (e) {}
  render();
}

/* ---------- UI penyimpanan ---------- */
function storageNoteInnerHTML() {
  return '<div style="display:flex;gap:10px;align-items:flex-start">' +
    '<span style="color:var(--accent);flex:none">' + icon('check') + '</span>' +
    '<div style="flex:1"><div class="small" style="font-weight:700">Data akun disimpan di cloud</div>' +
    '<div class="tiny muted" style="margin-top:3px;line-height:1.5">Pastikan indikator sinkronisasi menunjukkan data sudah tersimpan. Unduh cadangan berkala.</div>' +
    '<button class="btn btn-ghost btn-sm" style="margin-top:9px" data-act="backup">' + icon('download') + 'Unduh cadangan</button></div></div>';
}
function storageNoteHTML() {
  return '<div class="card storage-note" data-storage-note style="margin-top:10px">' + storageNoteInnerHTML() + '</div>';
}

function storageStatusHTML() {
  return '<div class="card" style="box-shadow:none">' +
    '<div class="small" style="font-weight:700">Data tersimpan di Supabase</div>' +
    '<div class="tiny muted" style="margin-top:4px;line-height:1.6">Data akun dapat dibuka kembali setelah masuk dengan akun yang sama dan tersambung ke internet.</div>' +
    '</div>';
}

function refreshAfterStorageChange() {
  var settingsOpen = typeof settingsSheet !== 'undefined' && settingsSheet && document.body.contains(settingsSheet.el);
  render();
  if (settingsOpen) openPengaturan();
}
