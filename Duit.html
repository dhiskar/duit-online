<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070C16">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit Online">
<meta name="application-name" content="Duit Online">
<meta name="description" content="Catatan keuangan online pribadi dengan sinkronisasi akun.">
<title>Duit Online — Catatan Keuangan</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./online.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B3B32'/%3E%3Cpath d='M20 25.5h24M20 32h16' stroke='%2334D399' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='43' cy='42' r='7' fill='none' stroke='%2334D399' stroke-width='4'/%3E%3C/svg%3E">
<style>
/* ============================================================
   DUIT — Catatan Keuangan · tema gelap/terang, mobile-first
   ============================================================ */
:root{
  --bg:#070C16;
  --fade:rgba(7,12,22,.94);
  --nav:rgba(7,12,22,.88);
  --card:rgba(19,31,49,.74);
  --card-solid:#111C2C;
  --glass:rgba(255,255,255,.05);
  --glass-2:rgba(255,255,255,.09);
  --field:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.17);
  --text:#EAF1FB;
  --muted:#8FA3BF;
  --dim:#7A8DA8;
  --accent:#2DD4A7;
  --accent-2:#34D399;
  --accent-deep:#0E9F6E;
  --accent-ink:#03231A;
  --blue:#60A5FA;
  --danger:#FB7185;
  --warn:#FBBF24;
  --purple:#A78BFA;
  --sheet:#0C1522;
  --glow-a:rgba(45,212,167,.14);
  --glow-b:rgba(96,165,250,.11);
  --shadow:0 18px 40px -30px rgba(0,0,0,.95);
  --r:20px;
  --nav-h:78px;
}
[data-theme="light"]{
  --bg:#F3F6FB;
  --fade:rgba(243,246,251,.94);
  --nav:rgba(243,246,251,.92);
  --card:#FFFFFF;
  --card-solid:#FFFFFF;
  --glass:#FFFFFF;
  --glass-2:#F1F5FA;
  --field:#F4F7FB;
  --line:rgba(15,27,45,.09);
  --line-strong:rgba(15,27,45,.16);
  --text:#0F1B2D;
  --muted:#52627A;
  --dim:#5E7088;
  --accent:#047857;
  --accent-2:#0E9F6E;
  --accent-deep:#047857;
  --accent-ink:#FFFFFF;
  --blue:#2563EB;
  --danger:#BE123C;
  --warn:#B45309;
  --purple:#7C3AED;
  --sheet:#FFFFFF;
  --glow-a:rgba(16,185,129,.09);
  --glow-b:rgba(37,99,235,.06);
  --shadow:0 18px 40px -32px rgba(15,27,45,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
[data-theme="light"]{color-scheme:light}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(900px 520px at 88% -8%, var(--glow-a), transparent 62%),
    radial-gradient(760px 460px at -12% 6%, var(--glow-b), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s,color .25s;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::selection{background:rgba(45,212,167,.3);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:calc(15px + env(safe-area-inset-top)) 18px 13px;
  background:linear-gradient(180deg,var(--fade) 20%, color-mix(in srgb, var(--fade) 60%, transparent) 78%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.topbar h1{font-size:20px;font-weight:750;letter-spacing:-.4px;line-height:1.2}
.topbar .hello{font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.topbar .grow{flex:1;min-width:0}
.top-actions{display:flex;align-items:center;gap:7px;flex:none}
.theme-btn{color:var(--accent)}
.icon-btn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--glass);border:1px solid var(--line);color:var(--text);
  transition:transform .15s, background .2s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}
.view{flex:1;padding:2px 18px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));outline:none}
.section{margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head h2{font-size:14px;font-weight:700;letter-spacing:.1px}
.section-head .link{font-size:12.5px;color:var(--accent);font-weight:650;padding:6px 4px;margin:-6px -4px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11.5px}
.small{font-size:13px}
.center{text-align:center}
.green{color:var(--accent)}
.red{color:var(--danger)}
.amber{color:var(--warn)}
.blue{color:var(--blue)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin:16px 0}
.footnote{font-size:11px;color:var(--dim);text-align:center;margin-top:26px;line-height:1.7}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);
}
[data-theme="light"] .card{box-shadow:0 10px 28px -24px rgba(15,27,45,.35)}
.card+.card{margin-top:10px}
.card.flush{padding:0;overflow:hidden}
.card-pad{padding:14px 16px}
.card-row{display:flex;align-items:center;gap:12px}

/* hero saldo */
.hero{
  position:relative;overflow:hidden;color:#F2FBF8;
  border-radius:26px;padding:20px;
  background:
    radial-gradient(420px 220px at 112% -35%, rgba(52,211,153,.42), transparent 68%),
    radial-gradient(300px 180px at -12% 120%, rgba(96,165,250,.18), transparent 65%),
    linear-gradient(158deg,#0D3F35 0%,#0A2130 62%,#091827 100%);
  border:1px solid rgba(52,211,153,.24);
  box-shadow:0 24px 48px -32px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08);
}
.hero.plain{background:linear-gradient(158deg,#123047,#0B1A2B 70%);border-color:rgba(255,255,255,.12)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#9BD4C5;font-weight:750}
.hero-eye{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#BFE9DD}
.hero-eye svg{width:16px;height:16px}
.hero-amount{font-size:33px;font-weight:780;letter-spacing:-1.3px;margin-top:6px;line-height:1.15;font-variant-numeric:tabular-nums}
.hero-amount small{font-size:15px;font-weight:600;color:#9DB9B3;letter-spacing:0;margin-right:3px}
.hero-sub{font-size:11.5px;color:#9DB9B3;margin-top:4px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.11)}
.hero-stat .k{font-size:10.5px;color:#8FB8AE;display:flex;align-items:center;gap:5px;letter-spacing:.2px}
.hero-stat .k svg{width:12px;height:12px}
.hero-stat .v{font-size:14.5px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.hero-stat .v.in{color:#6EE7B7}
.hero-stat .v.out{color:#FDA4AF}
.hero-stamp{position:absolute;right:-24px;top:-22px;width:118px;height:118px;border-radius:50%;border:1px solid rgba(52,211,153,.2);display:grid;place-items:center;color:rgba(52,211,153,.22);pointer-events:none}
.hero-stamp svg{width:42px;height:42px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.quick button{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 4px 11px;border-radius:17px;font-size:11.5px;font-weight:650;color:var(--text);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .15s,background .2s;
}
.quick button:active{transform:scale(.96)}
.quick .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.quick .ico svg{width:18px;height:18px}
.ico.green{background:rgba(45,212,167,.14);color:var(--accent)}
.ico.rose{background:rgba(251,113,133,.14);color:var(--danger)}
.ico.blue{background:rgba(96,165,250,.14);color:var(--blue)}
.ico.amber{background:rgba(251,191,36,.14);color:var(--warn)}
.ico.purple{background:rgba(167,139,250,.14);color:var(--purple)}

/* stat tiles */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.stat-row.three{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat .k svg{width:13px;height:13px;opacity:.85}
.stat .v{font-size:16px;font-weight:750;margin-top:4px;letter-spacing:-.4px}
.stat .v.sm{font-size:14px}
.stat .s{font-size:10.5px;color:var(--dim);margin-top:1px}

/* month bar */
.monthbar{display:flex;align-items:center;gap:8px;margin:16px 0 12px}
.mbtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--muted)}
.mbtn svg{width:16px;height:16px}
.mbtn:active{background:var(--glass-2)}
.mlabel{flex:1;text-align:center;font-size:13.5px;font-weight:700;letter-spacing:-.1px}
.mlabel .y{color:var(--dim);font-weight:600}
.magain{font-size:11px;font-weight:650;color:var(--accent);padding:7px 10px;border-radius:9px;background:rgba(45,212,167,.1);border:1px solid rgba(45,212,167,.2)}

/* search */
.search{position:relative;margin:10px 0 12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--dim);pointer-events:none}
.search input{
  width:100%;padding:12px 14px 12px 42px;border-radius:14px;font-size:14px;
  background:var(--field);border:1px solid var(--line);outline:none;color:var(--text)
}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:rgba(45,212,167,.5)}

/* filter chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:8px 13px;border-radius:99px;font-size:11.5px;font-weight:650;
  color:var(--muted);background:var(--glass);border:1px solid var(--line);
  transition:background .18s,color .18s,border-color .18s;
}
.chip:active{transform:scale(.97)}
.chip.on{background:rgba(45,212,167,.14);border-color:rgba(45,212,167,.34);color:var(--accent)}
.chip.plus{background:rgba(45,212,167,.16);border-color:rgba(45,212,167,.34);color:var(--accent);font-weight:800;font-size:16px;line-height:1;padding:6px 16px}
.chip.low{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.24)}

/* transaction list */
.tx-list{display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 4px 2px}
.day-head .d{font-size:11.5px;font-weight:700;color:var(--muted)}
.day-head .t{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tx{
  width:100%;text-align:left;display:flex;align-items:center;gap:11px;
  min-height:66px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  transition:transform .15s,background .2s;box-shadow:var(--shadow);
}
.tx:active{transform:scale(.985);background:var(--glass)}
.tx-ico{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center}
.tx-ico svg{width:19px;height:19px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tx-title{display:block;font-size:13.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{display:block;font-size:11px;line-height:1.3;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;text-align:right;flex:none}
.tx-amt{display:block;font-size:13.5px;font-weight:750;line-height:1.25;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.in{color:var(--accent)}
.tx-amt.out{color:var(--danger)}
.tx-amt.trf{color:var(--blue)}
.tx-time{display:block;font-size:10px;line-height:1.3;color:var(--dim);margin-top:2px;white-space:nowrap}
.tx-arrow{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--glass);color:var(--dim);flex:none}
.tx-arrow svg{width:14px;height:14px}

/* progress */
.track{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2));transition:width .4s}
.track i.warn{background:linear-gradient(90deg,#D97706,#FBBF24)}
.track i.over{background:linear-gradient(90deg,#BE123C,#FB7185)}
.track.slim{height:5px}

/* empty */
.empty{padding:32px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:20px;background:var(--glass)}
.empty .art{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;background:rgba(45,212,167,.1);color:var(--accent)}
.empty .art svg{width:28px;height:28px}
.empty h3{font-size:14px;font-weight:700}
.empty p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.empty .btn{margin-top:14px}

/* wallet cards */
.wallet-list{display:flex;flex-direction:column;gap:9px}
.wallet-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.w-ico{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center}
.w-ico svg{width:20px;height:20px}
.w-main{flex:1;min-width:0}
.w-name{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-type{font-size:10.5px;color:var(--muted);margin-top:2px}
.w-balance{text-align:right;font-size:14px;font-weight:750;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.w-balance small{display:block;font-size:9.5px;color:var(--dim);font-weight:600;letter-spacing:.1px;margin-top:1px}
.wallet-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.wallet-scroll::-webkit-scrollbar{display:none}
.wallet-mini{flex:0 0 142px;text-align:left;padding:13px 14px;border-radius:17px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.wallet-mini .wm-top{display:flex;align-items:center;gap:8px}
.wallet-mini .w-ico{width:30px;height:30px;border-radius:10px}
.wallet-mini .w-ico svg{width:15px;height:15px}
.wallet-mini .wm-name{font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet-mini .wm-bal{font-size:14.5px;font-weight:750;margin-top:9px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}

/* budget */
.budget-hero{padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.budget-hero .bh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.budget-hero .bh-k{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:750}
.budget-hero .bh-v{font-size:26px;font-weight:780;letter-spacing:-1px;margin-top:5px}
.budget-hero .bh-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.budget-hero .bh-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.budget-hero .bh-grid .k{font-size:10.5px;color:var(--muted)}
.budget-hero .bh-grid .v{font-size:13.5px;font-weight:700;margin-top:2px}
.budget-row{display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.budget-row .tx-ico{width:36px;height:36px;border-radius:11px}
.budget-row .tx-ico svg{width:17px;height:17px}
.budget-main{flex:1;min-width:0}
.budget-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.budget-name{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget-val{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.budget-val b{color:var(--text);font-weight:700}
.budget-row .track{margin-top:7px}
.budget-meta{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--dim);margin-top:5px}
.budget-edit{padding:5px 9px;border-radius:8px;font-size:10.5px;font-weight:650;color:var(--accent);background:rgba(45,212,167,.1);border:1px solid rgba(45,212,167,.18);flex:none}
.budget-edit:hover{background:rgba(45,212,167,.18)}

/* report charts */
.chart-card{padding:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:8px;height:152px;margin-top:16px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;min-width:0}
.bar-pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-radius:8px;background:linear-gradient(180deg,transparent,var(--glass));padding:0 2px}
.bar{width:44%;max-width:13px;border-radius:5px 5px 3px 3px;min-height:2px;transition:height .45s}
.bar.in{background:linear-gradient(180deg,#5EEAD4,#0E9F6E)}
.bar.out{background:linear-gradient(180deg,#FDA4AF,#E11D48)}
.bar-lbl{font-size:9.5px;color:var(--dim);font-weight:650;white-space:nowrap}
.bar-col.on .bar-lbl{color:var(--accent)}
.bar-col.on .bar-pair{background:rgba(45,212,167,.07)}

.donut-wrap{display:flex;align-items:center;gap:18px;margin-top:14px}
.donut{position:relative;width:138px;height:138px;border-radius:50%;flex:none;background:var(--line)}
.donut-hole{position:absolute;inset:20px;border-radius:50%;background:var(--card-solid);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.donut-hole .k{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.donut-hole .v{font-size:13px;font-weight:750;letter-spacing:-.3px;margin-top:2px;font-variant-numeric:tabular-nums}
.donut-hole .s{font-size:9px;color:var(--dim);margin-top:1px}
.donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.dl-row{display:flex;align-items:center;gap:7px;font-size:11px;min-width:0}
.dl-dot{width:8px;height:8px;border-radius:3px;flex:none}
.dl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.dl-val{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.cat-bars{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.cat-bar .cb-top{display:flex;justify-content:space-between;gap:10px;font-size:11.5px}
.cat-bar .cb-name{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.cat-bar .cb-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar .cb-val{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.cat-bar .track{height:5px;margin-top:5px}
.cat-bar .cb-name i{width:7px;height:7px;border-radius:2px;flex:none}

/* detail rows */
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;font-weight:600;word-break:break-word}
.detail-top{text-align:center;padding:8px 0 16px}
.detail-top .ico{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;margin:0 auto 12px}
.detail-top .ico svg{width:27px;height:27px}
.detail-top .amt{font-size:29px;font-weight:780;letter-spacing:-1.1px;margin-top:2px;font-variant-numeric:tabular-nums}
.detail-top .cap{font-size:12px;color:var(--muted);margin-top:5px}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:12px;line-height:1.5}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px}
.banner.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.22);color:#FDE68A}
.banner.info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.22);color:#BFDBFE}
.banner.ok{background:rgba(45,212,167,.09);border:1px solid rgba(45,212,167,.2);color:#A7F3D0}
[data-theme="light"] .banner.warn{color:#92400E;background:#FEF3C7;border-color:#FDE68A}
[data-theme="light"] .banner.info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
[data-theme="light"] .banner.ok{color:#065F46;background:#ECFDF5;border-color:#A7F3D0}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 17px;border-radius:14px;font-size:13.5px;font-weight:650;
  border:1px solid var(--line-strong);background:var(--glass);color:var(--text);
  transition:transform .15s,filter .2s,background .2s;
}
.btn:active{transform:scale(.975)}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(180deg,#3DDDAE,#0FAE82);color:#03231A;border-color:transparent;box-shadow:0 10px 24px -14px rgba(45,212,167,.85)}
[data-theme="light"] .btn-primary{background:linear-gradient(180deg,#047857,#065F46);color:#fff}
.btn-blue{background:linear-gradient(180deg,#7DB8FF,#3B82F6);color:#04162E;border-color:transparent}
[data-theme="light"] .btn-blue{background:linear-gradient(180deg,#2563EB,#1D4ED8);color:#fff}
.btn-ghost{background:var(--glass)}
.btn-danger{color:#FCA5B5;border-color:rgba(251,113,133,.28);background:rgba(251,113,133,.09)}
[data-theme="light"] .btn-danger{color:#BE123C;border-color:#FECDD3;background:#FFF1F2}
.btn-block{width:100%}
.btn-sm{padding:9px 12px;font-size:12px;border-radius:11px;gap:6px}
.btn-sm svg{width:15px;height:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:15px;height:15px}

/* tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;
  padding:7px 12px calc(7px + env(safe-area-inset-bottom));
  background:var(--nav);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.tabbar .inner{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;width:100%;max-width:520px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px 3px;border-radius:13px;color:var(--dim);font-size:10px;font-weight:650;transition:color .2s}
.tab svg{width:21px;height:21px}
.tab .ico-wrap{width:40px;height:25px;border-radius:9px;display:grid;place-items:center;transition:background .2s,color .2s}
.tab.on{color:var(--accent)}
.tab.on .ico-wrap{background:rgba(45,212,167,.13)}
.fab-slot{display:flex;justify-content:center;align-items:flex-start}
.fab{
  width:54px;height:54px;margin-top:-26px;border-radius:19px;
  display:grid;place-items:center;color:#03231A;
  background:linear-gradient(155deg,#5EEAD4,#0FAE82);
  border:3px solid var(--bg);
  box-shadow:0 14px 28px -10px rgba(16,185,129,.75), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s;
}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px}

/* sheet */
.sheet-backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(4,8,14,.62);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .22s ease;
}
[data-theme="light"] .sheet-backdrop{background:rgba(15,27,45,.35)}
.sheet-backdrop.in{opacity:1}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--sheet);
  border:1px solid var(--line-strong);border-bottom:0;
  border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(26px);opacity:.6;
  transition:transform .26s cubic-bezier(.2,.9,.25,1),opacity .2s;
  box-shadow:0 -20px 60px -40px rgba(0,0,0,.8);
}
.sheet-backdrop.in .sheet{transform:none;opacity:1}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:6px auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}
.sheet-head h2{font-size:18px;font-weight:750;letter-spacing:-.3px}
.sheet-head .sub{font-size:12px;color:var(--muted);margin-top:3px}
.sheet-head .icon-btn{margin-left:auto;flex:none;width:38px;height:38px;border-radius:12px}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}
.sheet-actions .btn-danger{flex:0 0 auto}
.sheet-actions.wrap{flex-wrap:wrap}
.sheet-actions.wrap .btn{flex:1 1 44%}
.sheet-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;border-radius:14px;font-size:15px;
  background:var(--field);border:1px solid var(--line);outline:none;color:var(--text);
  appearance:none;-webkit-appearance:none
}
.field textarea{min-height:74px;resize:vertical;line-height:1.5}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(45,212,167,.55);background:var(--glass)}
.field .hint{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.field-err{border-color:rgba(251,113,133,.7)!important}
.money{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:15px;background:var(--field);border:1px solid var(--line)}
.money:focus-within{border-color:rgba(45,212,167,.55)}
.money span{color:var(--muted);font-size:14px;font-weight:650}
.money input{border:0;background:none;padding:14px 0;font-size:22px;font-weight:750;letter-spacing:-.8px;width:100%;outline:none;font-variant-numeric:tabular-nums}
.money.big input{font-size:27px;letter-spacing:-1px}
.type-seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:15px}
.type-seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.18s}
.type-seg button.on{background:var(--glass-2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.type-seg button.on[data-tipe="masuk"]{background:rgba(45,212,167,.15);color:var(--accent)}
.type-seg button.on[data-tipe="keluar"]{background:rgba(251,113,133,.14);color:var(--danger)}
.type-seg button.on[data-tipe="transfer"]{background:rgba(96,165,250,.14);color:var(--blue)}
.kat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kat-pick{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px 8px;border-radius:13px;border:1px solid var(--line);background:var(--field);font-size:9.5px;font-weight:650;color:var(--muted);transition:.15s}
.kat-pick .kico{width:31px;height:31px;border-radius:10px;display:grid;place-items:center}
.kat-pick .kico svg{width:16px;height:16px}
.kat-pick span{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kat-pick.on{border-color:rgba(45,212,167,.5);background:rgba(45,212,167,.1);color:var(--text)}
.kat-pick:active{transform:scale(.96)}
.wallet-pick{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.wallet-pick::-webkit-scrollbar{display:none}
.wallet-pick button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;font-size:11.5px;font-weight:650;color:var(--muted);background:var(--field);border:1px solid var(--line)}
.wallet-pick button svg{width:15px;height:15px}
.wallet-pick button.on{border-color:rgba(45,212,167,.5);background:rgba(45,212,167,.1);color:var(--text)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;position:relative}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--sheet) inset}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.icon-pick{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.icon-pick svg{width:17px;height:17px}
.icon-pick.on{border-color:rgba(45,212,167,.5);background:rgba(45,212,167,.1);color:var(--accent)}
.amount-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.amount-chips button{padding:7px 11px;border-radius:9px;font-size:11px;font-weight:650;color:var(--muted);background:var(--field);border:1px solid var(--line)}
.amount-chips button:active{background:rgba(45,212,167,.14);color:var(--accent)}

/* settings */
.set-group{margin-top:18px}
.set-group>h3{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:750;margin:0 0 8px 4px}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row:active{background:var(--glass)}
.set-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.set-ico svg{width:17px;height:17px}
.set-main{flex:1;min-width:0}
.set-title{font-size:13px;font-weight:650}
.set-sub{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4;word-break:break-word}
.set-side{font-size:11px;color:var(--dim);flex:none;display:flex;align-items:center;gap:6px}
.set-side svg{width:15px;height:15px}
.theme-seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;margin:12px 14px 14px}
.theme-seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:9px;font-size:10px;font-weight:650;color:var(--muted)}
.theme-seg button svg{width:15px;height:15px}
.theme-seg button.on{background:var(--glass-2);color:var(--text)}
.set-input{width:100%;padding:10px 12px;border-radius:11px;font-size:13.5px;background:var(--field);border:1px solid var(--line);outline:none;color:var(--text)}
.set-input:focus{border-color:rgba(45,212,167,.5)}

/* toast */
.toast-root{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 18px}
.toast{
  max-width:420px;width:fit-content;padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:650;
  background:var(--card-solid);border:1px solid var(--line-strong);color:var(--text);
  box-shadow:0 14px 34px -18px rgba(0,0,0,.9);
  animation:toastIn .24s ease both;
}
.toast.err{border-color:rgba(251,113,133,.4);color:#FECDD3;background:rgba(48,17,26,.97)}
.toast.ok{border-color:rgba(52,211,153,.4);color:#A7F3D0;background:rgba(9,38,30,.97)}
[data-theme="light"] .toast{background:#fff;color:#0F1B2D}
[data-theme="light"] .toast.err{background:#FFF1F2;color:#9F1239;border-color:#FECDD3}
[data-theme="light"] .toast.ok{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view>*{animation:fadeUp .28s ease both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:359px){
  .hero-amount{font-size:28px}
  .quick button{font-size:10.5px}
  .kat-grid{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:14px}
  .tx-ico{width:36px;height:36px}
}

</style>

var BULAN_FULL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function $(sel, root) { return (root || document).querySelector(sel); }

}
function RpShort(n) {

  var f = function (v) { return String(Math.round(v * 10) / 10).replace('.', ','); };

function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  var d = +a[2], m = +a[1], y = +a[0];

  if (!iso) return '-';

function fmtDateTime(iso) {

  return sum(Object.keys(b.kat || {}), function (id) { return b.kat[id]; });
}
function budgetTotal(key) {
  var b = budgetOf(key);
  return b.total > 0 ? b.total : budgetKatSum(key);
}
function txKategoriSum(list, id) { return sum(list.filter(function (t) { return t.tipe === 'keluar' && t.kategori === id; }), function (t) { return t.jumlah; }); }
function kategoriPengeluaran(list) {
  var map = {};
  list.forEach(function (t) {
    if (t.tipe !== 'keluar') return;
    var k = kategoriById(t.kategori) || { id: t.kategori, nama: 'Lainnya', ikon: 'other', warna: '#64748B' };
    if (!map[k.id]) map[k.id] = { id: k.id, nama: k.nama, ikon: k.ikon, warna: k.warna, value: 0, count: 0 };
    map[k.id].value += t.jumlah;
    map[k.id].count++;
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.value - a.value; });
}
function txCariCocok(t, q) {
  if (!q) return true;
  var k = kategoriById(t.kategori) || {};
  var w = dompetById(t.dompet) || {};
  var tujuan = t.dompetTujuan ? (dompetById(t.dompetTujuan) || {}) : {};
  var hay = [t.catatan, k.nama, w.nama, tujuan.nama, t.jumlah, t.tanggal, t.tipe === 'masuk' ? 'pemasukan' : t.tipe === 'keluar' ? 'pengeluaran' : 'transfer'].join(' ').toLowerCase();
  return hay.indexOf(String(q).toLowerCase()) >= 0;
}

/* ---------- tema ---------- */
function temaTerpilih() { return (db.pengaturan && db.pengaturan.tema) || 'gelap'; }
function temaGelap() {
  var t = temaTerpilih();
  if (t === 'sistem') {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
  }
  return t === 'gelap';
}
function applyTheme() {
  var dark = temaGelap();
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#070C16' : '#F3F6FB');
  var btn = document.querySelector('[data-act="toggle-theme"]');
  if (btn) {
    var label = 'Ganti ke tema ' + (dark ? 'terang' : 'gelap');
    btn.innerHTML = icon(dark ? 'sun' : 'moon');
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
}
function toggleTema() {
  var next = temaGelap() ? 'terang' : 'gelap';
  db.pengaturan.tema = next;
  applyTheme();
  saveDB();
  $$('.theme-seg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.value === next);
  });
  toast('Tema ' + (next === 'gelap' ? 'gelap' : 'terang') + ' aktif', 'ok');
}
function promptInstall() {
  if (!deferredInstall) {
    toast('Buka menu browser → Tambahkan ke layar utama', '');
    return;
  }
  var ev = deferredInstall;
  deferredInstall = null;
  try { ev.prompt(); } catch (e) { toast('Gunakan menu browser → Tambahkan ke layar utama', ''); return; }
  if (ev.userChoice) {
    ev.userChoice.then(function (choice) {
      if (choice && choice.outcome === 'accepted') toast('Duit dipasang di layar utama', 'ok');
    }).catch(function () {});
  }
}
applyTheme();
try {

function toast(msg, kind) {
  var root = $('#toastRoot');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (kind === 'err' ? 'err' : kind === 'ok' ? 'ok' : '');
  el.textContent = msg;
  root.appendChild(el);
  var t = setTimeout(function () {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(function () { el.remove(); }, 260);
  }, kind === 'err' ? 3800 : 2600);
  root.addEventListener('click', function () { clearTimeout(t); el.remove(); }, { once: true });
}

var openSheets = [];
var ignoreNextPop = false;
var historyClearPending = false;

/* Satu penanda riwayat dipakai selama ada sheet. Saat sheet terakhir ditutup,
   penanda dibersihkan dengan history.back(). Pelentikan ini mencegah tombol
   kembali menutup sheet baru yang dibuka tepat setelah sheet lama ditutup. */
function clearSheetHistory() {
  if (historyClearPending) return;
  try {
    if (history.state && history.state.sheetOpen) {
      historyClearPending = true;
      ignoreNextPop = true;
      history.back();
    }
  } catch (e) {
    historyClearPending = false;
    ignoreNextPop = false;
  }
}
function scheduleSheetHistoryClear() {
  setTimeout(function () {
    if (!openSheets.length) clearSheetHistory();
  }, 0);
}

function openSheet(opts) {
  var backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || 'Dialog') + '">' +
      '<div class="sheet-grip"></div>' +
      '<div class="sheet-head">' +
        '<div class="grow"><h2>' + esc(opts.title || '') + '</h2>' +
        (opts.subtitle ? '<div class="sub">' + esc(opts.subtitle) + '</div>' : '') + '</div>' +
        '<button class="icon-btn" data-act="close-sheet" aria-label="Tutup">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="sheet-body">' + (opts.body || '') + '</div>' +
    '</div>';
  $('#sheetRoot').appendChild(backdrop);
  var api = {
    el: backdrop,
    close: function () {
      var i = openSheets.indexOf(api);
      if (i >= 0) openSheets.splice(i, 1);
      backdrop.classList.remove('in');
      document.body.style.overflow = openSheets.length ? 'hidden' : '';
      setTimeout(function () { backdrop.remove(); }, 240);
      if (!openSheets.length) scheduleSheetHistoryClear();
    }
  };
  openSheets.push(api);
  document.body.style.overflow = 'hidden';
  try { if (!history.state || !history.state.sheetOpen) history.pushState({ sheetOpen: 1 }, ''); } catch (e) {}
  requestAnimationFrame(function () { backdrop.classList.add('in'); });
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) api.close(); });
  return api;
}
function closeTopSheet() {
  var s = openSheets[openSheets.length - 1];
  if (s) { s.close(); return true; }
  return false;
}
window.addEventListener('popstate', function () {
  if (ignoreNextPop) { ignoreNextPop = false; historyClearPending = false; return; }
  if (openSheets.length) closeTopSheet();
});

function confirmSheet(o) {
  return new Promise(function (resolve) {
    var sheet = openSheet({
      title: o.title || 'Konfirmasi',
      subtitle: o.subtitle || '',
      body: '<div class="banner ' + (o.danger === false ? 'info' : 'warn') + '">' + icon(o.danger === false ? 'info' : 'warn') +
        '<div>' + esc(o.message || '') + '</div></div>' +
        '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" data-act="cf-no">Batal</button>' +
        '<button class="btn ' + (o.danger === false ? 'btn-primary' : 'btn-danger') + '" data-act="cf-yes">' + esc(o.confirmText || 'Lanjutkan') + '</button>' +
        '</div>'
    });
    sheet.el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'cf-yes') { sheet.close(); resolve(true); }
      if (b.dataset.act === 'cf-no') { sheet.close(); resolve(false); }
    });
  });
}

  if (act === 'close-sheet') { closeTopSheet(); return; }
  if (act === 'tab') { go(el.dataset.tab); return; }
  if (act === 'back') { go('home'); return; }
  if (act === 'tambah') { openTransaksiForm('keluar'); return; }
  if (act === 'pengaturan') { openPengaturan(); return; }
  if (act === 'toggle-theme') { toggleTema(); return; }
  if (act === 'install-app') { promptInstall(); return; }
  if (act === 'lihat-semua') { go('transaksi'); return; }
  if (act === 'tx-open') { openDetailTransaksi(id); return; }
  if (act === 'dompet-open') { go('dompet'); return; }
  if (act === 'dompet-baru') { openDompetForm(); return; }
  if (act === 'dompet-edit') { openDompetForm(id); return; }
  if (act === 'transfer') { openTransaksiForm('transfer'); return; }
  if (act === 'masuk') { openTransaksiForm('masuk'); return; }
  if (act === 'keluar') { openTransaksiForm('keluar'); return; }
  if (act === 'budget-total') { openBudgetSheet('total'); return; }
  if (act === 'budget-kat') { openBudgetSheet('kat', id); return; }
  if (act === 'budget-copy') { salinAnggaran(); return; }
  if (act === 'saldo-eye') { ui.showSaldo = !ui.showSaldo; render(); return; }
  if (act === 'bulan') { gantiBulan(el.dataset.scope, Number(el.dataset.delta) || 0); return; }
  if (act === 'bulan-ini') { bulanIni(el.dataset.scope); return; }
  if (act === 'filter-tx') { ui.txFilter = el.dataset.value; render(); return; }
  if (act === 'csv') { exportCsv(); return; }
  if (act === 'kategori') { openKategoriManager(); return; }
  if (act === 'set-theme') { setTema(el.dataset.value); return; }
  if (act === 'backup') { exportBackup(); return; }
  if (act === 'restore') { var inp = $('#importFile'); if (inp) inp.click(); return; }
  if (act === 'contoh') { isiContoh(); return; }
  if (act === 'reset') { resetData(); return; }
  if (act === 'fs-pick-save') { if (typeof fsPickSave === 'function') fsPickSave(); return; }
  if (act === 'fs-pick-open') { if (typeof fsPickOpen === 'function') fsPickOpen(); return; }
  if (act === 'fs-request') { if (typeof fsRequestPermission === 'function') fsRequestPermission(); return; }
  if (act === 'fs-unlink') { if (typeof fsUnlink === 'function') fsUnlink(); return; }
});

  return 'background:conic-gradient(' + parts.join(',') + ');';

      '<button data-act="transfer"><span class="ico blue">' + icon('swap') + '</span>Transfer</button>' +
    '</div>' +
    storageNoteSafe();

  /* anggaran */
  html += '<div class="section"><div class="section-head"><h2>Anggaran ' + monthShort(key) + '</h2>' +
    '<button class="link" data-act="tab" data-tab="anggaran">' + (bTotal > 0 ? 'Atur' : 'Buat') + '</button></div>';
  if (bTotal > 0) {
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
        '<div class="small" style="font-weight:650">Terpakai ' + Rp(keluar) + '</div>' +
        '<div class="tiny ' + (bLeft < 0 ? 'red' : 'muted') + '">' + (bLeft < 0 ? 'lewat ' + Rp(-bLeft) : 'sisa ' + Rp(Math.max(0, bLeft))) + '</div></div>' +
      '<div class="track"><i class="' + trackClass(bPct) + '" style="width:' + trackWidth(bPct) + '"></i></div>' +
      '<div class="tiny dim" style="margin-top:7px;display:flex;justify-content:space-between"><span>Rp ' + new Intl.NumberFormat('id-ID').format(bTotal) + ' total</span><span>' + bPct + '%</span></div>' +
      '</div>';
  } else {
    html += '<button class="card" data-act="budget-total" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px">' +
      '<span class="ico green" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(45,212,167,.12);color:var(--accent);flex:none">' + icon('target') + '</span>' +
      '<span style="flex:1"><span class="small" style="font-weight:650;display:block">Belum ada anggaran</span>' +
      '<span class="tiny muted" style="display:block;margin-top:2px">Tentukan batas pengeluaran bulan ini</span></span>' +
      icon('chevR', '') + '</button>';
  }
  html += '</div>';

  /* dompet */
  html += '<div class="section"><div class="section-head"><h2>Dompet</h2>' +
    '<button class="link" data-act="dompet-open">Kelola</button></div>' +
    '<div class="wallet-scroll">' + db.dompet.map(walletMiniHTML).join('') + '</div></div>';

  /* kategori */
  if (kat.length) {
    html += '<div class="section"><div class="section-head"><h2>Pengeluaran per kategori</h2>' +
      '<button class="link" data-act="tab" data-tab="laporan">Laporan</button></div><div class="card">' +
      kat.map(function (k) {
        return '<div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">' +
          '<span class="tx-ico" style="width:32px;height:32px;border-radius:10px;background:' + tint(k.warna, .14) + ';color:' + k.warna + ';flex:none">' + icon(k.ikon) + '</span>' +
          '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">' +
            '<span class="tiny" style="font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(k.nama) + '</span>' +
            '<span class="tiny num" style="font-weight:700;flex:none">' + Rp(k.value) + '</span></div>' +
          '<div class="track slim" style="margin-top:5px"><i style="width:' + (maxKat ? Math.max(3, k.value / maxKat * 100) : 0) + '%;background:' + k.warna + '"></i></div></div></div>';
      }).join('') +
      (kat.length < 4 ? '<div class="tiny dim">' + (4 - kat.length) + ' kategori lain belum dipakai</div>' : '') +
      '</div></div>';
  }

  /* transaksi terakhir */
  html += '<div class="section"><div class="section-head"><h2>Transaksi terakhir</h2>' +
    (recent.length ? '<button class="link" data-act="lihat-semua">Lihat semua</button>' : '') + '</div>';
  if (recent.length) {
    html += '<div class="tx-list">' + recent.map(txRowHTML).join('') + '</div>';
  } else {
    html += emptyHTML('transaksi', 'Belum ada catatan', 'Mulai catat pemasukan dan pengeluaran pertamamu. Data tersimpan di akun cloud-mu.',
      '<button class="btn btn-primary btn-sm" data-act="tambah">' + icon('plus') + 'Catat sekarang</button>');
  }
  html += '</div>';

  html += '<div class="footnote">Duit Online · catatan keuangan<br>Data akun tersimpan di Supabase</div>';
  return html;
}

/* ---------- transaksi ---------- */
function transaksiHTML() {
  var key = ui.txBulan;
  var all = txBulan(key);
  var masuk = totalMasuk(all);
  var keluar = totalKeluar(all);
  var selisih = masuk - keluar;
  var filtered = all.filter(function (t) {
    if (ui.txFilter !== 'semua' && t.tipe !== ui.txFilter) return false;
    return txCariCocok(t, ui.txCari);
  });

  var html = monthBarHTML('tx', key, all.length + ' catatan') +
    '<div class="stat-row three">' +
      '<div class="stat"><div class="k">Masuk</div><div class="v green num">+Rp ' + RpShort(masuk) + '</div></div>' +
      '<div class="stat"><div class="k">Keluar</div><div class="v red num">−Rp ' + RpShort(keluar) + '</div></div>' +
      '<div class="stat"><div class="k">Selisih</div><div class="v ' + (selisih < 0 ? 'red' : 'num') + '" style="font-size:14px">' + (selisih < 0 ? '−' : '') + 'Rp ' + RpShort(Math.abs(selisih)) + '</div></div>' +
    '</div>' +
    '<div class="search">' + icon('search') +
      '<input type="search" placeholder="Cari catatan, kategori, dompet…" value="' + esc(ui.txCari) + '" data-search="txCari" aria-label="Cari transaksi">' +
    '</div>' +
    '<div class="chips">' +
      [['semua', 'Semua'], ['masuk', 'Masuk'], ['keluar', 'Keluar'], ['transfer', 'Transfer']].map(function (f) {
        return '<button class="chip ' + (ui.txFilter === f[0] ? 'on' : '') + '" data-act="filter-tx" data-value="' + f[0] + '">' + f[1] + '</button>';
      }).join('') +
    '</div>';

  html += '<div class="section" style="margin-top:16px">';
  if (!all.length) {
    html += emptyHTML('transaksi', 'Belum ada transaksi', 'Catatan bulan ' + monthLabel(key) + ' masih kosong.',
      '<button class="btn btn-primary btn-sm" data-act="tambah">' + icon('plus') + 'Tambah catatan</button>');
  } else if (!filtered.length) {
    html += emptyHTML('search', 'Tidak ditemukan', 'Coba kata kunci lain atau ubah filter.');
  } else {
    html += '<div class="tiny dim" style="padding:0 4px 2px">' + filtered.length + ' catatan' + (ui.txCari ? ' cocok dengan “' + esc(ui.txCari) + '”' : '') + '</div>' +
      groupTxHTML(filtered);
  }
  html += '</div>';
  return html;
}

/* ---------- anggaran ---------- */
function anggaranHTML() {
  var key = ui.budgetBulan;
  var list = txBulan(key);
  var spent = totalKeluar(list);
  var total = budgetTotal(key);
  var sisa = total - spent;
  var p = pct(spent, total);
  var hari = daysLeft(key);
  var aman = total > 0 && sisa > 0 && hari > 0 ? Math.floor(sisa / hari) : 0;
  var prev = addMonths(key, -1);
  var prevTotal = budgetTotal(prev);
  var kat = kategoriJenis('keluar');

  var rows = kat.map(function (k) {
    var b = (budgetOf(key).kat || {})[k.id] || 0;
    return { k: k, b: b, spent: txKategoriSum(list, k.id) };
  }).sort(function (a, b) {
    if (a.b > 0 && b.b <= 0) return -1;
    if (b.b > 0 && a.b <= 0) return 1;
    if (a.b > 0 && b.b > 0) return (b.spent / b.b) - (a.spent / a.b);
    return b.spent - a.spent;
  });

  var html = monthBarHTML('budget', key, null);

  html += '<div class="budget-hero">' +
    '<div class="bh-top"><div><div class="bh-k">Anggaran ' + monthShort(key) + '</div>' +
      '<div class="bh-v num">' + (total > 0 ? Rp(total) : '<span class="muted" style="font-size:18px">Belum diatur</span>') + '</div>' +
      '<div class="bh-s">' + (total > 0 ? 'Terpakai ' + Rp(spent) + ' · ' + p + '%' : 'Tanpa batas pengeluaran bulan ini') + '</div></div>' +
      '<button class="btn btn-ghost btn-sm" data-act="budget-total">' + icon('edit') + (total > 0 ? 'Ubah' : 'Atur') + '</button></div>';

  if (total > 0) {
    html += '<div class="track" style="height:9px"><i class="' + trackClass(p) + '" style="width:' + trackWidth(p) + '"></i></div>' +
      '<div class="bh-grid">' +
        '<div><div class="k">' + (sisa >= 0 ? 'Sisa anggaran' : 'Lewat anggaran') + '</div><div class="v ' + (sisa < 0 ? 'red' : 'green') + '">' + Rp(Math.abs(sisa)) + '</div></div>' +
        '<div><div class="k">Aman per hari</div><div class="v">' + (aman > 0 ? Rp(aman) : '—') + '<span class="tiny dim" style="font-weight:500"> / ' + hari + ' hr</span></div></div>' +
      '</div>';
  } else if (prevTotal > 0) {
    html += '<button class="btn btn-ghost btn-block btn-sm" style="margin-top:14px" data-act="budget-copy">' + icon('copy') + 'Salin anggaran ' + monthShort(prev) + ' (' + Rp(prevTotal) + ')</button>';
  } else {
    html += '<div class="banner info" style="margin-top:14px">' + icon('info') +
      '<div>Atur total anggaran, lalu isi batas per kategori agar lebih terkontrol.</div></div>';
  }
  html += '</div>';

  html += '<div class="section"><div class="section-head"><h2>Per kategori</h2><span class="tiny dim">' + (total > 0 ? 'sisa ' + Rp(Math.max(0, sisa)) : '') + '</span></div>' +
    '<div class="stack">';

  rows.forEach(function (r) {
    var p2 = pct(r.spent, r.b);
    var left = r.b - r.spent;
    if (r.b > 0) {
      html += '<div class="budget-row">' + txIconHTML({ tipe: 'keluar', kategori: r.k.id }) +
        '<div class="budget-main"><div class="budget-line"><span class="budget-name">' + esc(r.k.nama) + '</span>' +
          '<span class="budget-val"><b>' + Rp(r.spent) + '</b> / ' + Rp(r.b) + '</span></div>' +
        '<div class="track"><i class="' + trackClass(p2) + '" style="width:' + trackWidth(p2) + '"></i></div>' +
        '<div class="budget-meta"><span>' + (left >= 0 ? 'Sisa ' + Rp(left) : 'Lewat ' + Rp(-left)) + '</span><span>' + p2 + '%</span></div></div>' +
        '<button class="budget-edit" data-act="budget-kat" data-id="' + esc(r.k.id) + '">Ubah</button></div>';
    } else {
      html += '<div class="budget-row" style="opacity:.92">' + txIconHTML({ tipe: 'keluar', kategori: r.k.id }) +
        '<div class="budget-main"><div class="budget-line"><span class="budget-name">' + esc(r.k.nama) + '</span>' +
          '<span class="budget-val">' + Rp(r.spent) + '</span></div>' +
          '<div class="budget-meta"><span>Belum dianggarkan</span><span>' + (r.spent ? 'terpakai' : '—') + '</span></div></div>' +
        '<button class="budget-edit" data-act="budget-kat" data-id="' + esc(r.k.id) + '">Atur</button></div>';
    }
  });
  html += '</div></div>';

  html += '<div class="footnote">Anggaran dihitung dari pengeluaran pada bulan yang dipilih.<br>Transfer antar dompet tidak dihitung pengeluaran.</div>';
  return html;
}

/* ---------- laporan ---------- */
function laporanHTML() {
  var key = ui.lapBulan;
  var list = txBulan(key);
  var masuk = totalMasuk(list);
  var keluar = totalKeluar(list);
  var net = masuk - keluar;
  var kat = kategoriPengeluaran(list);
  var katTotal = sum(kat, function (k) { return k.value; });
  var hari = key === monthKey(todayISO()) ? new Date().getDate() : (key < monthKey(todayISO()) ? daysInMonth(key) : 0);
  var rata = hari > 0 ? Math.round(keluar / hari) : 0;

  /* hari terboros */
  var perHari = {};
  list.forEach(function (t) {
    if (t.tipe !== 'keluar') return;
    perHari[t.tanggal] = (perHari[t.tanggal] || 0) + t.jumlah;
  });
  var hariBor = Object.keys(perHari).sort(function (a, b) { return perHari[b] - perHari[a]; })[0];

  /* grafik 6 bulan */
  var keys = [];
  for (var i = 5; i >= 0; i--) keys.push(addMonths(key, -i));
  var maxBar = 0;
  var barsData = keys.map(function (k) {
    var l = txBulan(k);
    var m = totalMasuk(l), o = totalKeluar(l);
    maxBar = Math.max(maxBar, m, o);
    return { key: k, masuk: m, keluar: o };
  });

  var html = monthBarHTML('lap', key, list.length + ' catatan') +
    '<div class="budget-hero">' +
      '<div class="bh-k">Arus kas bersih ' + monthShort(key) + '</div>' +
      '<div class="bh-v num ' + (net < 0 ? 'red' : 'green') + '">' + (net < 0 ? '−' : '+') + Rp(Math.abs(net)) + '</div>' +
      '<div class="bh-s">' + (net >= 0 ? 'Pemasukan lebih besar dari pengeluaran' : 'Pengeluaran melebihi pemasukan') + '</div>' +
      '<div class="bh-grid">' +
        '<div><div class="k">Pemasukan</div><div class="v green">+' + Rp(masuk) + '</div></div>' +
        '<div><div class="k">Pengeluaran</div><div class="v red">−' + Rp(keluar) + '</div></div>' +
      '</div></div>';

  /* bar chart */
  html += '<div class="section"><div class="section-head"><h2>6 bulan terakhir</h2>' +
    '<div class="legend"><span><i style="background:#2DD4A7"></i>Masuk</span><span><i style="background:#FB7185"></i>Keluar</span></div></div>' +
    '<div class="card chart-card"><div class="bars">' +
    barsData.map(function (d) {
      var hin = maxBar ? Math.max(d.masuk ? 3 : 1, d.masuk / maxBar * 100) : 1;
      var hout = maxBar ? Math.max(d.keluar ? 3 : 1, d.keluar / maxBar * 100) : 1;
      return '<div class="bar-col ' + (monthKey(todayISO()) === d.key ? 'on' : '') + '">' +
        '<div class="bar-pair">' +
          '<div class="bar in" title="Masuk ' + esc(Rp(d.masuk)) + '" style="height:' + hin + '%"></div>' +
          '<div class="bar out" title="Keluar ' + esc(Rp(d.keluar)) + '" style="height:' + hout + '%"></div>' +
        '</div><div class="bar-lbl">' + monthShort(d.key) + '</div></div>';
    }).join('') +
    '</div><div class="tiny dim center" style="margin-top:10px">Tertinggi: ' + (maxBar ? Rp(maxBar) : '—') + '</div></div></div>';

  /* donut kategori */
  html += '<div class="section"><div class="section-head"><h2>Ke mana uang pergi?</h2>' +
    '<span class="tiny dim">' + monthShort(key) + '</span></div>';
  if (kat.length) {
    var topLegend = kat.slice(0, 5);
    html += '<div class="card">' +
      '<div class="donut-wrap"><div class="donut" style="' + donutStyle(kat) + '">' +
        '<div class="donut-hole"><span class="k">Pengeluaran</span><span class="v">' + RpShort(katTotal) + '</span><span class="s">' + kat.length + ' kategori</span></div></div>' +
        '<div class="donut-legend">' +
          topLegend.map(function (k) {
            return '<div class="dl-row"><i class="dl-dot" style="background:' + k.warna + '"></i><span class="dl-name">' + esc(k.nama) + '</span>' +
              '<span class="dl-val">' + pct(k.value, katTotal) + '%</span></div>';
          }).join('') +
          (kat.length > 5 ? '<div class="dl-row"><i class="dl-dot" style="background:#475569"></i><span class="dl-name">' + (kat.length - 5) + ' kategori lain</span><span class="dl-val">' + (100 - sum(topLegend, function (k) { return pct(k.value, katTotal); })) + '%</span></div>' : '') +
        '</div></div>' +
      '<div class="cat-bars">' +
        kat.slice(0, 6).map(function (k) {
          return '<div class="cat-bar"><div class="cb-top"><span class="cb-name"><i style="background:' + k.warna + '"></i><span>' + esc(k.nama) + '</span></span>' +
            '<span class="cb-val">' + Rp(k.value) + '</span></div>' +
            '<div class="track"><i style="width:' + Math.max(2, k.value / katTotal * 100) + '%;background:' + k.warna + '"></i></div></div>';
        }).join('') +
      '</div></div>';
  } else {
    html += emptyHTML('laporan', 'Belum ada pengeluaran', 'Grafik kategori akan muncul setelah kamu mencatat pengeluaran bulan ini.');
  }
  html += '</div>';

  /* insight */
  html += '<div class="section"><div class="section-head"><h2>Ringkasan cepat</h2></div><div class="stat-row">' +
    '<div class="stat"><div class="k">' + icon('calendar') + 'Rata-rata / hari</div><div class="v num">' + Rp(rata) + '</div><div class="s">' + hari + ' hari berjalan</div></div>' +
    '<div class="stat"><div class="k">' + icon('arrowUp') + 'Hari terboros</div><div class="v sm">' + (hariBor ? fmtDateShort(hariBor) : '—') + '</div><div class="s">' + (hariBor ? Rp(perHari[hariBor]) : 'Belum ada') + '</div></div>' +
    '</div></div>';

  /* dompet */
  html += '<div class="section"><div class="section-head"><h2>Saldo dompet</h2>' +
    '<button class="link" data-act="dompet-open">Kelola</button></div><div class="stack">' +
    db.dompet.map(function (w) {
      return '<div class="wallet-card"><span class="w-ico" style="background:' + tint(w.warna, .14) + ';color:' + w.warna + '">' + icon(walletIcon(w.jenis)) + '</span>' +
        '<div class="w-main"><div class="w-name">' + esc(w.nama) + '</div><div class="w-type">' + esc(w.jenis) + '</div></div>' +
        '<div class="w-balance">' + Rp(saldoDompet(w.id)) + '<small>saldo</small></div></div>';
    }).join('') +
    '</div></div>';

  html += '<div class="section"><button class="btn btn-ghost btn-block" data-act="csv">' + icon('download') + 'Ekspor CSV bulan ini</button>' +
    '<div class="footnote">File CSV bisa dibuka di Excel / Google Sheets.</div></div>';
  return html;
}

/* ---------- dispatcher ---------- */
function viewHTML() {
  if (route.name === 'transaksi') return transaksiHTML();
  if (route.name === 'anggaran') return anggaranHTML();
  if (route.name === 'laporan') return laporanHTML();
  if (route.name === 'dompet') return dompetHTML();
  return homeHTML();
}

'use strict';

var settingsSheet = null;

/* ---------- util form ---------- */
function fmtInput(n) { return n ? new Intl.NumberFormat('id-ID').format(Math.round(n)) : ''; }
function moneyField(value, opts) {
  opts = opts || {};
  return '<div class="money ' + (opts.big ? 'big' : '') + '"><span>Rp</span>' +

/* ---------- form transaksi ---------- */
function openTransaksiForm(tipe, id) {
  var editing = id ? txById(id) : null;
  if (id && !editing) { toast('Catatan tidak ditemukan', 'err'); return; }
  var st = editing ? {
    tipe: editing.tipe,
    jumlah: editing.jumlah,
    kategori: editing.kategori,
    dompet: editing.dompet,
    dompetTujuan: editing.dompetTujuan,
    tanggal: editing.tanggal,
    catatan: editing.catatan
  } : {
    tipe: tipe || 'keluar',
    jumlah: 0,
    kategori: '',
    dompet: dompetPertama(),
    dompetTujuan: '',
    tanggal: todayISO(),
    catatan: ''
  };
  if (!editing) {
    if (st.tipe === 'transfer') {
      st.kategori = '';
      st.dompetTujuan = (db.dompet.filter(function (w) { return w.id !== st.dompet; })[0] || {}).id || '';
    } else {
      st.kategori = defaultKategori(st.tipe);
    }
  }

  var sheet = openSheet({
    title: editing ? 'Ubah catatan' : 'Catatan baru',
    subtitle: editing ? fmtDateLong(editing.tanggal) : 'Isi pemasukan, pengeluaran, atau transfer',
    body: ''
  });

  function paint() {
    sheet.el.querySelector('.sheet-body').innerHTML = transaksiFormHTML(st, !!editing);
  }
  paint();

  sheet.el.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tipe],[data-kat],[data-dompet],[data-tujuan],[data-add],[data-act],[data-today]');
    if (!b) return;

    if (b.dataset.tipe) {
      st.tipe = b.dataset.tipe;
      if (st.tipe === 'transfer') {
        if (!st.dompetTujuan || st.dompetTujuan === st.dompet) {
          st.dompetTujuan = (db.dompet.filter(function (w) { return w.id !== st.dompet; })[0] || {}).id || '';
        }
      } else {
        var k = kategoriById(st.kategori);
        if (!k || k.jenis !== st.tipe) st.kategori = defaultKategori(st.tipe);
      }
      paint();
      return;
    }
    if (b.dataset.kat) { st.kategori = b.dataset.kat; paint(); return; }
    if (b.dataset.dompet) {
      st.dompet = b.dataset.dompet;
      if (st.tipe === 'transfer' && st.dompetTujuan === st.dompet) {
        st.dompetTujuan = (db.dompet.filter(function (w) { return w.id !== st.dompet; })[0] || {}).id || '';
      }
      paint();
      return;
    }
    if (b.dataset.tujuan) { st.dompetTujuan = b.dataset.tujuan; paint(); return; }
    if (b.dataset.add) {
      st.jumlah = Math.min(999999999999, st.jumlah + Number(b.dataset.add));
      var inp = sheet.el.querySelector('#f_jumlah');
      if (inp) { inp.value = fmtInput(st.jumlah); }
      return;
    }
    if (b.dataset.today) {
      st.tanggal = todayISO();
      var d = sheet.el.querySelector('[name="tanggal"]');
      if (d) d.value = st.tanggal;
      return;
    }
    if (b.dataset.act === 'simpan-tx') {
      simpanTransaksi(st, editing, sheet);
      return;
    }
    if (b.dataset.act === 'hapus-tx' && editing) {
      hapusTransaksi(editing.id, sheet);
      return;
    }
  });

  sheet.el.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'f_jumlah') st.jumlah = num(el.value);
    if (el.name === 'tanggal') st.tanggal = el.value || todayISO();
    if (el.name === 'catatan') st.catatan = el.value.slice(0, 90);
  });
}

function transaksiFormHTML(st, editing) {
  var isTransfer = st.tipe === 'transfer';
  var wOpts = db.dompet.map(function (w) {
    return '<button type="button" class="' + (st.dompet === w.id ? 'on' : '') + '" data-dompet="' + esc(w.id) + '">' +
      icon(walletIcon(w.jenis)) + esc(w.nama) + '</button>';
  }).join('');
  var tOpts = db.dompet.map(function (w) {
    return '<button type="button" class="' + (st.dompetTujuan === w.id ? 'on' : '') + '" data-tujuan="' + esc(w.id) + '">' +
      icon(walletIcon(w.jenis)) + esc(w.nama) + '</button>';
  }).join('');

  var katList = kategoriJenis(isTransfer ? 'keluar' : st.tipe);
  var katHTML = katList.map(function (k) {
    return '<button type="button" class="kat-pick ' + (st.kategori === k.id ? 'on' : '') + '" data-kat="' + esc(k.id) + '">' +
      '<span class="kico" style="background:' + tint(k.warna, .16) + ';color:' + k.warna + '">' + icon(k.ikon) + '</span>' +
      '<span>' + esc(k.nama) + '</span></button>';
  }).join('');

  var html = '<div class="form">' +
    '<div class="type-seg">' +
      '<button type="button" data-tipe="masuk" class="' + (st.tipe === 'masuk' ? 'on' : '') + '">Masuk</button>' +
      '<button type="button" data-tipe="keluar" class="' + (st.tipe === 'keluar' ? 'on' : '') + '">Keluar</button>' +
      '<button type="button" data-tipe="transfer" class="' + (st.tipe === 'transfer' ? 'on' : '') + '">Transfer</button>' +
    '</div>' +

    '<div class="field"><label>Jumlah</label>' + moneyField(st.jumlah, { big: true, id: 'f_jumlah' }) +
      '<div class="amount-chips">' +
        '<button type="button" data-add="10000">+10 rb</button>' +
        '<button type="button" data-add="25000">+25 rb</button>' +
        '<button type="button" data-add="50000">+50 rb</button>' +
        '<button type="button" data-add="100000">+100 rb</button>' +
      '</div></div>';

  if (isTransfer) {
    html += '<div class="field"><label>Dari dompet</label><div class="wallet-pick">' + wOpts + '</div></div>' +
      '<div class="field"><label>Ke dompet</label><div class="wallet-pick">' + tOpts + '</div>' +
      (st.dompet === st.dompetTujuan ? '<div class="hint red">Pilih dompet tujuan yang berbeda.</div>' : '') + '</div>';
  } else {
    html += '<div class="field"><label>Kategori</label><div class="kat-grid">' + katHTML + '</div></div>' +
      '<div class="field"><label>Dompet</label><div class="wallet-pick">' + wOpts + '</div></div>';
  }

  html += '<div class="field"><label>Tanggal</label>' +
      '<input type="date" name="tanggal" value="' + esc(st.tanggal) + '">' +
      '<div class="hint"><button type="button" class="link-inline" data-today style="color:var(--accent);font-size:10.5px;padding:0">Gunakan tanggal hari ini</button></div>' +
    '</div>' +
    '<div class="field"><label>Catatan <span class="dim" style="font-weight:500">(opsional)</span></label>' +
      '<input type="text" name="catatan" maxlength="90" placeholder="mis. makan siang, bensin" value="' + esc(st.catatan) + '"></div>';

  html += '<div class="sheet-actions">' +
    (editing ? '<button type="button" class="btn btn-danger" data-act="hapus-tx" aria-label="Hapus">' + icon('trash') + '</button>' : '') +
    '<button type="button" class="btn btn-primary" data-act="simpan-tx">' + icon('check') + (editing ? 'Simpan perubahan' : 'Simpan catatan') + '</button>' +
    '</div></div>';
  return html;
}

function simpanTransaksi(st, editing, sheet) {
  if (!st.jumlah || st.jumlah <= 0) { toast('Jumlah harus lebih dari 0', 'err'); return; }
  if (st.tipe !== 'transfer') {
    var k = kategoriById(st.kategori);
    if (!k || k.jenis !== st.tipe) { toast('Pilih kategori dulu', 'err'); return; }
  }
  if (!dompetById(st.dompet)) { toast('Pilih dompet dulu', 'err'); return; }
  if (st.tipe === 'transfer') {
    if (!dompetById(st.dompetTujuan)) { toast('Pilih dompet tujuan', 'err'); return; }
    if (st.dompet === st.dompetTujuan) { toast('Dompet asal dan tujuan tidak boleh sama', 'err'); return; }
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(st.tanggal)) { toast('Tanggal tidak valid', 'err'); return; }

  var data = {
    tipe: st.tipe,
    jumlah: Math.round(st.jumlah),
    kategori: st.tipe === 'transfer' ? '' : st.kategori,
    dompet: st.dompet,
    dompetTujuan: st.tipe === 'transfer' ? st.dompetTujuan : '',
    tanggal: st.tanggal,
    catatan: String(st.catatan || '').trim()
  };

  if (editing) {
    Object.assign(editing, data);
  } else {
    db.transaksi.push(Object.assign({ id: nextId('t'), dibuat: nowStamp() }, data));
  }
  saveDB();
  ui.txBulan = monthKey(st.tanggal);
  sheet.close();
  render();
  toast(editing ? 'Catatan diperbarui' : 'Catatan tersimpan', 'ok');
}

function hapusTransaksi(id, sheet) {
  var t = txById(id);
  if (!t) return;
  confirmSheet({
    title: 'Hapus catatan?',
    message: (t.tipe === 'transfer' ? 'Transfer ' : '') + Rp(t.jumlah) + ' pada ' + fmtDate(t.tanggal) + ' akan dihapus permanen.',
    confirmText: 'Ya, hapus'
  }).then(function (ok) {
    if (!ok) return;
    db.transaksi = db.transaksi.filter(function (x) { return x.id !== id; });
    saveDB();
    if (sheet) sheet.close();
    render();
    toast('Catatan dihapus', 'ok');
  });
}

/* ---------- detail ---------- */
function openDetailTransaksi(id) {

    '<div class="cap">' + esc(title) + ' · ' + fmtDate(t.tanggal) + '</div></div>' +
    '<div class="card" style="padding:2px 14px">' +
      '<div class="kv"><span class="k">Jenis</span><span class="v">' + (isTransfer ? 'Transfer antar dompet' : t.tipe === 'masuk' ? 'Pemasukan' : 'Pengeluaran') + '</span></div>' +
      (isTransfer ? '' : '<div class="kv"><span class="k">Kategori</span><span class="v">' + esc(k.nama || '-') + '</span></div>') +
      '<div class="kv"><span class="k">Dompet</span><span class="v">' + esc(w.nama) + '</span></div>' +
      (tujuan ? '<div class="kv"><span class="k">Ke dompet</span><span class="v">' + esc(tujuan.nama) + '</span></div>' : '') +
      '<div class="kv"><span class="k">Tanggal</span><span class="v">' + fmtDateLong(t.tanggal) + '</span></div>' +
      '<div class="kv"><span class="k">Dicatat</span><span class="v">' + fmtDateTime(t.dibuat) + '</span></div>' +
      (t.catatan ? '<div class="kv"><span class="k">Catatan</span><span class="v">' + esc(t.catatan) + '</span></div>' : '') +
    '</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="tx-edit">' + icon('edit') + 'Ubah</button>' +
      '<button class="btn btn-danger" data-act="tx-delete">' + icon('trash') + '</button>' +
    '</div>';

  var sheet = openSheet({ title: 'Detail catatan', body: body });

/* ---------- dompet ---------- */
function openDompetForm(id) {
  var editing = id ? dompetById(id) : null;
  var st = editing ? {
    nama: editing.nama,
    jenis: editing.jenis,
    saldoAwal: Number(editing.saldoAwal) || 0,
    warna: editing.warna
  } : { nama: '', jenis: 'Tunai', saldoAwal: 0, warna: '#22C55E' };

  function body() {
    return '<div class="form">' +
      '<div class="field"><label>Nama dompet</label>' +
        '<input type="text" id="f_wnama" maxlength="30" placeholder="mis. BCA, GoPay, Dompet Tunai" value="' + esc(st.nama) + '"></div>' +
      '<div class="field"><label>Jenis</label><select id="f_wjenis">' +
        ['Tunai', 'Bank', 'E-Wallet', 'Lainnya'].map(function (j) {
          return '<option value="' + j + '" ' + (st.jenis === j ? 'selected' : '') + '>' + j + '</option>';
        }).join('') + '</select>' +
        '<div class="hint">Ikon mengikuti jenis dompet.</div></div>' +
      '<div class="field"><label>Saldo awal</label>' + moneyField(st.saldoAwal, { id: 'f_wsaldo' }) +
        '<div class="hint">Isi saldo saat ini ketika pertama kali mulai mencatat. Boleh 0.</div></div>' +
      '<div class="field"><label>Warna</label><div class="swatches">' +
        WARNA_PILIH.map(function (c) {
          return '<button type="button" class="swatch ' + (st.warna === c ? 'on' : '') + '" data-warna="' + c + '" style="background:' + c + '" aria-label="Warna ' + c + '"></button>';
        }).join('') + '</div></div>' +
      '<div class="sheet-actions">' +
        (editing ? '<button type="button" class="btn btn-danger" data-wact="hapus-dompet">' + icon('trash') + '</button>' : '') +
        '<button type="button" class="btn btn-primary" data-wact="simpan-dompet">' + icon('check') + 'Simpan</button>' +
      '</div></div>';
  }

  var sheet = openSheet({
    title: editing ? 'Ubah dompet' : 'Dompet baru',
    subtitle: editing ? txDompetCount(editing.id) + ' transaksi terkait' : 'Tambah tempat menyimpan uang',
    body: body()
  });

  function bind() {
    var nm = sheet.el.querySelector('#f_wnama');
    var sal = sheet.el.querySelector('#f_wsaldo');
    var jen = sheet.el.querySelector('#f_wjenis');
    if (nm) nm.addEventListener('input', function () { st.nama = nm.value; });
    if (sal) sal.addEventListener('input', function () { st.saldoAwal = num(sal.value); });
    if (jen) jen.addEventListener('change', function () { st.jenis = jen.value; });
  }
  bind();

  sheet.el.addEventListener('click', function (e) {
    var w = e.target.closest('[data-warna]');
    if (w) { st.warna = w.dataset.warna; sheet.el.querySelector('.sheet-body').innerHTML = body(); bind(); return; }
    var b = e.target.closest('[data-wact]');
    if (!b) return;
    if (b.dataset.wact === 'simpan-dompet') {
      if (!st.nama.trim()) { toast('Nama dompet wajib diisi', 'err'); return; }
      if (editing) {
        Object.assign(editing, { nama: st.nama.trim(), jenis: st.jenis, saldoAwal: Math.round(st.saldoAwal), warna: st.warna });
      } else {
        db.dompet.push({ id: nextId('w'), nama: st.nama.trim(), jenis: st.jenis, saldoAwal: Math.round(st.saldoAwal), warna: st.warna });
      }
      saveDB();
      sheet.close();
      render();
      toast(editing ? 'Dompet diperbarui' : 'Dompet ditambahkan', 'ok');
    }
    if (b.dataset.wact === 'hapus-dompet' && editing) {
      if (db.dompet.length <= 1) { toast('Minimal harus ada satu dompet', 'err'); return; }
      var count = txDompetCount(editing.id);
      if (count > 0) { toast('Dompet masih dipakai ' + count + ' transaksi. Hapus atau pindahkan transaksinya dulu.', 'err'); return; }
      confirmSheet({
        title: 'Hapus dompet?',
        message: 'Dompet “' + editing.nama + '” akan dihapus. Tindakan ini tidak bisa dibatalkan.',
        confirmText: 'Ya, hapus'
      }).then(function (ok) {
        if (!ok) return;
        db.dompet = db.dompet.filter(function (x) { return x.id !== editing.id; });
        saveDB();
        sheet.close();
        render();
        toast('Dompet dihapus', 'ok');
      });
    }
  });
}

/* ---------- anggaran ---------- */
function openBudgetSheet(mode, katId) {
  var key = ui.budgetBulan;
  var b = budgetOf(key);
  var cat = katId ? kategoriById(katId) : null;
  if (mode === 'kat' && !cat) return;
  var current = mode === 'total' ? (b.total || 0) : (b.kat[katId] || 0);
  var spent = mode === 'total' ? totalKeluar(txBulan(key)) : txKategoriSum(txBulan(key), katId);
  var prev = addMonths(key, -1);
  var prevVal = mode === 'total' ? budgetTotal(prev) : ((budgetOf(prev).kat || {})[katId] || 0);
  var st = { nilai: current };

  var body = '<div class="form">' +
    '<div class="banner info">' + icon('info') + '<div>Anggaran ' + esc(mode === 'total' ? monthLabel(key) : (cat.nama + ' · ' + monthLabel(key))) +
      '. Terpakai saat ini <b>' + Rp(spent) + '</b>.</div></div>' +
    '<div class="field"><label>' + (mode === 'total' ? 'Total anggaran bulan ini' : 'Batas untuk ' + esc(cat.nama)) + '</label>' +
      moneyField(current, { big: true, id: 'f_budget' }) +
      '<div class="amount-chips">' +
        [500000, 1000000, 2000000, 5000000].map(function (v) {
          return '<button type="button" data-set="' + v + '">' + RpShort(v) + '</button>';
        }).join('') +
      '</div></div>' +
    '<div class="sheet-actions">' +
      (current > 0 ? '<button type="button" class="btn btn-danger" data-bact="hapus">' + icon('trash') + '</button>' : '') +
      '<button type="button" class="btn btn-primary" data-bact="simpan">' + icon('check') + 'Simpan</button>' +
    '</div>' +
    (prevVal > 0 ? '<button type="button" class="btn btn-ghost btn-block btn-sm" data-bact="copy">' + icon('copy') + 'Salin dari ' + monthShort(prev) + ' (' + Rp(prevVal) + ')</button>' : '') +
    '<div class="sheet-note">' + (mode === 'total'
      ? 'Jika total dikosongkan, total anggaran dihitung otomatis dari jumlah anggaran per kategori.'
      : 'Anggaran kategori terpisah dari total. Total memakai angka total bila diisi, atau jumlah semua kategori bila kosong.') + '</div>' +
    '</div>';

  var sheet = openSheet({
    title: mode === 'total' ? 'Atur anggaran' : 'Anggaran kategori',
    subtitle: mode === 'total' ? monthLabel(key) : cat.nama,
    body: body
  });

  var input = sheet.el.querySelector('#f_budget');
  if (input) input.addEventListener('input', function () { st.nilai = num(input.value); });

  sheet.el.addEventListener('click', function (e) {
    var set = e.target.closest('[data-set]');
    if (set) {
      st.nilai = Number(set.dataset.set);
      if (input) input.value = fmtInput(st.nilai);
      return;
    }
    var b2 = e.target.closest('[data-bact]');
    if (!b2) return;
    var act = b2.dataset.bact;

    if (act === 'copy') {
      if (prevVal <= 0) return;
      st.nilai = prevVal;
      if (input) input.value = fmtInput(prevVal);
      toast('Nilai dari bulan lalu dimasukkan — tekan Simpan', 'ok');
      return;
    }
    if (act === 'hapus' || act === 'simpan') {
      var val = act === 'hapus' ? 0 : Math.round(st.nilai);
      db.anggaran = db.anggaran || {};
      var entry = db.anggaran[key] || { total: 0, kat: {} };
      entry.kat = entry.kat || {};
      if (mode === 'total') entry.total = val;
      else {
        if (val > 0) entry.kat[katId] = val;
        else delete entry.kat[katId];
      }
      db.anggaran[key] = entry;
      saveDB();
      sheet.close();
      render();
      toast(act === 'hapus' ? 'Anggaran dihapus' : 'Anggaran disimpan', 'ok');
    }
  });
}

function salinAnggaran() {
  var key = ui.budgetBulan;
  var prev = addMonths(key, -1);
  var source = db.anggaran[prev];
  if (!source) { toast('Tidak ada anggaran bulan lalu', 'err'); return; }
  confirmSheet({
    title: 'Salin anggaran?',
    message: 'Anggaran ' + monthLabel(prev) + ' (total ' + Rp(budgetTotal(prev)) + ') akan disalin ke ' + monthLabel(key) + '.',
    confirmText: 'Salin'
  }).then(function (ok) {
    if (!ok) return;
    db.anggaran[key] = JSON.parse(JSON.stringify(source));
    saveDB();
    render();
    toast('Anggaran disalin', 'ok');
  });
}

        '<span class="set-side">' + icon('edit') + '</span></button>';
    });
    html += '</div>' +
      '<button type="button" class="btn btn-primary btn-block" style="margin-top:16px" data-kadd="1">' + icon('plus') + 'Tambah kategori</button>' +
      '<div class="sheet-note">Kategori yang sudah dipakai tidak bisa dihapus. Warna dan ikon bisa diubah kapan saja.</div>';
